<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><rect width="1080" height="1350" fill="#f5f7fb"/><rect x="70" y="65" width="940" height="1220" rx="34" fill="#ffffff" stroke="#dfe4ec" stroke-width="2"/><text x="120" y="135" font-size="26" font-weight="500" fill="#667085">营养证据卡</text><text x="120" y="183" font-size="26" font-weight="500" fill="#667085">氨糖软骨素能缓解关节痛吗？</text><text x="120" y="265" font-size="64" font-weight="750" fill="#9e332d">不太值得买。</text><rect x="110" y="390" width="860" height="210" rx="24" fill="#edf5ff" stroke="#dfe4ec"/><text x="150" y="448" font-size="24" font-weight="650" fill="#667085">对谁可能有用</text><text x="150" y="502" font-size="30" font-weight="600" fill="#265d97">研究主要针对已确诊膝骨关节炎，不能照搬到所有</text><text x="150" y="550" font-size="30" font-weight="600" fill="#265d97">关节痛。</text><rect x="110" y="650" width="860" height="210" rx="24" fill="#f7f8fa" stroke="#dfe4ec"/><text x="150" y="708" font-size="24" font-weight="650" fill="#667085">效果上限</text><text x="150" y="762" font-size="30" font-weight="600" fill="#172033">氨糖对疼痛最多可能有小幅改善；功能无明确获益</text><text x="150" y="810" font-size="30" font-weight="600" fill="#172033">，联用效果更不确定。</text><rect x="110" y="910" width="860" height="210" rx="24" fill="#fff2f0" stroke="#dfe4ec"/><text x="150" y="968" font-size="24" font-weight="650" fill="#667085">安全红线</text><text x="150" y="1022" font-size="30" font-weight="600" fill="#9e332d">服用华法林、孕哺期或关节突然红肿发热时，先咨</text><text x="150" y="1070" font-size="30" font-weight="600" fill="#9e332d">询医生或药师。</text><text x="120" y="1225" font-size="21" font-weight="400" fill="#667085">证据更新：2026-09-24　完整研究与来源请查看可展开 HTML</text></svg>