<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><rect width="1080" height="1350" fill="#f5f7fb"/><rect x="70" y="65" width="940" height="1220" rx="34" fill="#ffffff" stroke="#dfe4ec" stroke-width="2"/><text x="120" y="135" font-size="26" font-weight="500" fill="#667085">营养证据卡</text><text x="120" y="183" font-size="26" font-weight="500" fill="#667085">氨糖软骨素与关节疼痛</text><text x="120" y="265" font-size="64" font-weight="750" fill="#265d97">只对特定人群值得。</text><rect x="110" y="390" width="860" height="210" rx="24" fill="#edf5ff" stroke="#dfe4ec"/><text x="150" y="448" font-size="24" font-weight="650" fill="#667085">对谁可能有用</text><text x="150" y="502" font-size="30" font-weight="600" fill="#265d97">只适用于已确诊膝骨关节炎、且产品配方与研究接</text><text x="150" y="550" font-size="30" font-weight="600" fill="#265d97">近的人。</text><rect x="110" y="650" width="860" height="210" rx="24" fill="#f7f8fa" stroke="#dfe4ec"/><text x="150" y="708" font-size="24" font-weight="650" fill="#667085">效果上限</text><text x="150" y="762" font-size="30" font-weight="600" fill="#172033">即使有效，疼痛改善通常也很小，功能未见稳定改</text><text x="150" y="810" font-size="30" font-weight="600" fill="#172033">善。</text><rect x="110" y="910" width="860" height="210" rx="24" fill="#fff2f0" stroke="#dfe4ec"/><text x="150" y="968" font-size="24" font-weight="650" fill="#667085">安全红线</text><text x="150" y="1022" font-size="30" font-weight="600" fill="#9e332d">关节红肿发热、外伤后剧痛或正在用抗凝药时，先</text><text x="150" y="1070" font-size="30" font-weight="600" fill="#9e332d">就医或咨询药师。</text><text x="120" y="1225" font-size="21" font-weight="400" fill="#667085">证据更新：2026-08-27　完整研究与来源请查看可展开 HTML</text></svg>